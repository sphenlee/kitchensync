[package]
name = "kitchensync"
version = "0.1.0"
authors = ["Stephen Lee <sphen.lee@gmail.com>"]
edition = "2018"

[dependencies]
#atty = "0.2.2"
async-trait = "0.1"
aws-sdk-s3-transfer-manager = "0.1.1"
clap = "4.5"
clout = "0.2"
colored = "3"
env_logger = "0.11"
futures = "0.3"
indicatif = "0.17"
log = "0.4"
rusoto_core = "0.48"
rusoto_s3 = "0.48"
serde = "1.0"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }
tokio-util = "0.7"
toml = "0.9"
url = "2"
utime = "0.3"
walkdir = "2"

[[bin]]
name = "kitchensync"
