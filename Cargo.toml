[package]
name = "kitchensync"
version = "0.1.0"
authors = ["Stephen Lee <sphen.lee@gmail.com>"]
edition = "2018"

[dependencies]
clap = "4.5"
walkdir = "2"
url = "2"
sha1 = "0.10"
log = "0.4"
env_logger = "0.11"
colored = "2.1"
#atty = "0.2.2"
rusoto_core = "*"
rusoto_s3 = "*"
indicatif = "0.17"
utime = "0.3"
tokio = { version = "1", features = ["fs"] }
clout = "0.2"
async-trait = "0.1"
futures = "*"
tokio-util = "0.7"
thiserror = "1"

[[bin]]
name = "kitchensync"
