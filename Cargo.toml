[package]
name = "kitchensync"
version = "0.1.0"
authors = ["Stephen Lee <sphen.lee@gmail.com>"]
edition = "2018"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
aws-sdk-s3-transfer-manager = "0.1.1"
aws-config = { version= "1.8.17", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.134.0"
clap = "4.6.1"
clout = "0.2"
colored = "3"
futures = "0.3.32"
indicatif = "0.18.4"
log = "0.4.30"
rayon = "1.12.0"
serde = "1.0"
sha1 = "0.11.0"
thiserror = "2"
tokio = { version = "1.52.3", features = ["fs", "tracing"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"]}
toml = "0.9.8"
url = "2"
utime = "0.3"
walkdir = "2"

[[bin]]
name = "kitchensync"
